/* ===== COORDINATE CONVENTION (map grid) =====
 * Lot is 208.7 ft square, centered at world (0,0). Units = feet. +Z points to the front (road/gate), X increases left->right as seen from the street.
 * Grid cells are 5 ft x 5 ft. 42 columns lettered spreadsheet-style A..Z, AA..AP run left->right as seen from the street (A starts at the left property line, x=-104.35).
 * Rows 1..42 run from the front property line (row 1, z=+104.35) toward the back. Column AP / row 42 are partial (3.7 ft). Red labels/yellow lines every 5 cells (25 ft).
 * Cell id format: "AB-17" or "B-20" (column letter, dash, row number). cellCenter('B-20') -> {x,z}; placeAt('B-20', type, opts) places a future object at that cell's center.

const controls=new OrbitControls(cam,renderer.domElement); controls.enableDamping=true; controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN}; controls.maxPolarAngle=Math.PI/2.05;

function makeTileTexture(){const S=512,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');
 const cols=8,rows=6,tw=S/cols,th=S/rows; let sd=7; const r=()=>((sd=(sd*16807)%2147483647)/2147483647);

  const gr=g.createLinearGradient(x,0,x+tw,0); // barrel cross-section shading: dark trough -> lit crown -> dark
  [[0,.45],[.25,.85],[.5,1.12],[.72,.9],[1,.42]].forEach(([t,k])=>gr.addColorStop(t,`rgb(${base.map(c=>Math.min(255,c*k)|0)})`));

function wallRun(x0,y0,x1,y1,t,h,c,grp){const hor=Math.abs(y1-y0)<1;const a0=hor?Math.min(x0,x1):Math.min(y0,y1),a1=hor?Math.max(x0,x1):Math.max(y0,y1),k=hor?y0:x0;
